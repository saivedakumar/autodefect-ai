name: AI Retest

on:
  push:
    branches: [main]

jobs:
  ai-retest:
    runs-on: [self-hosted, ai-pipeline]
    steps:
      - uses: actions/checkout@v4

      - name: Find the merged PR for this push
        id: find_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          PR_NUMBER=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/pulls" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')")
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Call AI retest service
        shell: bash
        env:
          SERVICE_TOKEN: ${{ secrets.AUTODEFECT_SERVICE_TOKEN }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          curl -sf -X POST "http://127.0.0.1:8000/retests/run" \
            -H "Content-Type: application/json" \
            -H "X-Service-Token: $SERVICE_TOKEN" \
            -d "{\"pr_number\": $PR_NUMBER}"
